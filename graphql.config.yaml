# Two projects over one schema. Regenerate BOTH together:
#
#   turms gen                      # against the live schema below
#   turms gen --config <copy>      # with `schema:` pointed at rekuest/api/schema.graphql
#
# The second form is what you want while refactoring -- generating from the snapshot
# keeps a drifting server out of your diff. Either way turms writes the schema it
# generated from into the dumped project.json, so check `git diff rekuest/*/project.json`
# and restore the `schema` key to this URL before committing: rekuest/arkitekt.py ships
# rekuest/api/project.json to downstream code generation.
#
# Needs turms with `external_modules.include` (a module that owns part of the
# vocabulary: here arkitekt_spec.actions).
projects:
  # The wire vocabulary. The action language -- how an app declares its
  # actions, states, locks and bloks -- is arkitekt-spec's (arkitekt_spec.actions,
  # hand-maintained, carrying its own structural rules); this project imports
  # those names and generates the rest of the schema's enums and inputs. An app
  # speaks only this; importing rekuest loads it and stops there.
  rekuest_protocol:
    schema: http://jhnnsrs-lab/rekuest/schema
    documents: graphql/**/**.graphql
    extensions:
      turms:
        out_dir: rekuest/protocol
        dump_schema: false
        external_modules:
          - module: arkitekt_spec.actions
            kinds: [enum, input]
            include: &action_language
              - ActionArgumentInput
              - ActionDemandInput
              - ActionDependencyInput
              - ActionKind
              - AgentDependencyInput
              - AgentProbeInput
              - ArgPortInput
              - AssignPolicy
              - AssignWidgetInput
              - BlokImplementationInput
              - ChoiceAssignWidgetInput
              - ChoiceInput
              - ChoiceReturnWidgetInput
              - ComponentNodeInput
              - ComponentPropInput
              - CustomAssignWidgetInput
              - CustomReturnWidgetInput
              - DefinitionInput
              - DescriptorInput
              - DescriptorOperator
              - DynamicValueInput
              - EffectClass
              - EffectInput
              - EffectKind
              - ImplementAgentInput
              - ImplementationInput
              - LockDefinitionInput
              - LockImplementationInput
              - OptimisticInput
              - OptionKey
              - PortGroupInput
              - PortKind
              - PortMatchInput
              - ProvidesInput
              - ProxyAssignWidgetInput
              - RequiresInput
              - ReturnPortInput
              - ReturnWidgetInput
              - SearchAssignWidgetInput
              - SliderAssignWidgetInput
              - StateAccessorInput
              - StateChoiceAssignWidgetInput
              - StateDefinitionInput
              - StateDemandInput
              - StateDependencyInput
              - StateImplementationInput
              - StringAssignWidgetInput
              - TestTargetInput
              - TrackInput
              - UtilCallInput
              - ValidatorInput
              - WindowFunction
              - WindowInput
        always_resolve_interfaces: true
        exclude_typenames: true
        dump_configuration: true
        options:
          enabled: true
          populate_by_name: true
          alias_mode: split
          use_enum_values: true
          extra: forbid
          types:
            - input
        freeze:
          enabled: true
        stylers:
          - type: turms.stylers.default.DefaultStyler
          - type: turms.stylers.appender.AppenderStyler
            append_fragment: ""
        plugins:
          - type: turms.plugins.enums.EnumsPlugin
          - type: turms.plugins.inputs.InputsPlugin
        processors:
          - type: turms.processors.disclaimer.DisclaimerProcessor
        scalar_definitions:
          uuid: str
          Callback: str
          Any: typing.Any
          AnyInput: typing.Any
          JSONSerializable: rekuest.scalars.JSONSerializable
          UISchema: rekuest.scalars.UISchema
          AnyDefault: typing.Any
          Args: rekuest.scalars.Args
          ValueMap: rekuest.scalars.ValueMap
          MediaLike: rekuest.scalars.MediaLike
          ID: rath.scalars.ID
          ActionHash: rekuest.scalars.ActionHash
          Arg: typing.Any
          Identifier: rekuest.scalars.Identifier
          SearchQuery: rekuest.scalars.SearchQuery
        additional_bases:
          CreateBlokInput:
            - rekuest.traits.blok.CreateBlokInputTrait
  # The client surface: fragments, operations and the RekuestApi mixin, over
  # the vocabulary above. Only rekuest/client/ and rekuest/arkitekt.py may
  # name it -- tests/test_layering.py enforces that.
  rekuest:
    schema: http://jhnnsrs-lab/rekuest/schema
    documents: graphql/**/**.graphql
    extensions:
      turms:
        out_dir: rekuest/api
        dump_schema: true
        external_modules:
          # The action language from arkitekt-spec, everything else from the
          # protocol module (a module with `include` claims its names first).
          - module: arkitekt_spec.actions
            kinds: [enum, input]
            include: *action_language
          - module: rekuest.protocol.schema
            kinds: [enum, input]
            from_project: rekuest_protocol
        always_resolve_interfaces: true
        exclude_typenames: true
        dump_configuration: true
        options:
          enabled: true
          populate_by_name: true
          alias_mode: split
          use_enum_values: true
          extra: forbid
          types:
            - input
        freeze:
          enabled: true
        stylers:
          - type: turms.stylers.default.DefaultStyler
          - type: turms.stylers.appender.AppenderStyler
            append_fragment: ""
        plugins:
          - type: turms.plugins.fragments.FragmentsPlugin
          - type: turms.plugins.operations.OperationsPlugin
          - type: turms.plugins.client.ClientPlugin
            # Every operation is a method of RekuestApi, which Rekuest (and the
            # internal RekuestGraphQL) mix in. Each method hands its operation to
            # execute/aexecute/subscribe/asubscribe of self, which those two
            # clients implement over their rath.
            client_class: RekuestApi
            # Everything Rekuest defines itself (fields, call helpers, register...).
            reserved_from:
              - rekuest.client.client.Rekuest
            coercible_scalars:
              SearchQuery: rekuest.scalars.SearchQueryCoercible
              ID: rath.scalars.IDCoercible
            expand_input_types:
              - input
        processors:
          - type: turms.processors.disclaimer.DisclaimerProcessor
        scalar_definitions:
          uuid: str
          Callback: str
          Any: typing.Any
          AnyInput: typing.Any
          JSONSerializable: rekuest.scalars.JSONSerializable
          UISchema: rekuest.scalars.UISchema
          AnyDefault: typing.Any
          Args: rekuest.scalars.Args
          ValueMap: rekuest.scalars.ValueMap
          MediaLike: rekuest.scalars.MediaLike
          ID: rath.scalars.ID
          ActionHash: rekuest.scalars.ActionHash
          Arg: typing.Any
          Identifier: rekuest.scalars.Identifier
          SearchQuery: rekuest.scalars.SearchQuery
        additional_bases:
          Action:
            - rekuest.traits.action.Callable
