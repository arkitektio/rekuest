query GetMaterializedBlok($id: ID!) {
  materializedBlok(id: $id) {
    ...DetailMaterializedBlok
  }
}

query SearchMaterializedBloks($search: String, $values: [ID!], $limit: Int, $offset: Int) {
  options: materializedBloks(
    filters: {search: $search, ids: $values}
    pagination: {limit: $limit, offset: $offset}
  ) {
    label: name
    value: id
  }
}

query ListBloks($search: String, $provided: Boolean, $limit: Int, $offset: Int) {
  bloks(
    filters: {search: $search, provided: $provided}
    pagination: {limit: $limit, offset: $offset}
  ) {
    ...DetailBlok
  }
}

query BlokRevisions($id: ID!, $limit: Int! = 20, $offset: Int! = 0) {
  blok(id: $id) {
    revisions(limit: $limit, offset: $offset) {
      ...BlokRevision
    }
  }
}

# An action's own bloks, one per context.
query ActionBloks($action: ID!) {
  action(id: $action) {
    id
    bloks {
      ...ActionBlok
    }
  }
}
