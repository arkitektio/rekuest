query GetState($id: ID!) {
  state(id: $id) {
    ...State
  }
}


query CheckoutAgent(
  $agent: ID!
  $timestamp: DateTime
  $forwardPatchCount: Int! = 0
  $backwardPatchCount: Int! = 0
) {
  checkoutAgent(
    agent: $agent
    timestamp: $timestamp
    forwardPatchCount: $forwardPatchCount
    backwardPatchCount: $backwardPatchCount
  ) {
    agentId
    values
    globalRevision
    forwardPatches {
      ...StatePatch
    }
    backwardPatches {
      ...StatePatch
    }
  }
}
