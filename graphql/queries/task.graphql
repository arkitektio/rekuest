query requests {
  tasks {
    ...Task
  }
}


query GetEvent($id: ID!){
  event(id: $id){
    ...TaskEvent
  }
}


# A task's events so far, oldest first: what a caller reads when its change feed
# was not subscribed yet while the task already ran.
query TaskEvents($id: ID!) {
  task(id: $id) {
    id
    events(ordering: [{createdAt: ASC}]) {
      ...TaskEvent
    }
  }
}

# What a client needs to show a run with its action's bloks: the bloks, the agent bound to
# each dependency key, and the space the run was started in.
query TaskRunView($id: ID!) {
  task(id: $id) {
    id
    space {
      id
      name
    }
    actionBloks {
      ...ActionBlok
    }
    dependencyAgents {
      ...TaskDependencyAgent
    }
  }
}
