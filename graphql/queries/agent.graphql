query GetAgent($id: ID!) {
  agent(id: $id) {
    ...Agent
  }
}


query ListAgents($filters: AgentFilter, $pagination: OffsetPaginationInput) {
  agents(filters: $filters, pagination: $pagination) {
    ...Agent
  }
}


query GetAgentByIdentifiers($app: String!, $version: String, $deviceId: String) {
  agent(app: $app, version: $version, deviceId: $deviceId) {
    ...Agent
  }
}


query SearchAgents($search: String, $values: [ID!], $requires: [RequiresInput!], $limit: Int, $offset: Int) {
  options: agents(
    filters: {search: $search, ids: $values, requires: $requires}
    pagination: {limit: $limit, offset: $offset}
  ) {
    label: name
    value: id
  }
}


query DesignAgents($filters: AgentFilter, $pagination: OffsetPaginationInput) {
  agents(filters: $filters, pagination: $pagination) {
    ...DesignAgent
  }
}
