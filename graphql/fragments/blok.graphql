fragment Blok on Blok {
  id
  name
   
}

fragment MaterializedBlok on MaterializedBlok {
  id
}

fragment BlokPortMatch on PortMatch {
  at
  key
  kind
  identifier
  nullable
  dimension
  children {
    at
    key
    kind
    identifier
    nullable
    dimension
    children {
      at
      key
      kind
      identifier
      nullable
      dimension
      children {
        at
        key
        kind
        identifier
        nullable
        dimension
      }
    }
  }
}

fragment BlokDependency on BlokDependency {
  key
  description
  optional
  autoResolvable
  appFilter
  versionFilter
  minViableInstances
  maxViableInstances
  actionDependencies {
    key
    description
    optional
    demand {
      hash
      key
      app
      version
      name
      argMatches {
        ...BlokPortMatch
      }
      returnMatches {
        ...BlokPortMatch
      }
      protocols
      forceArgLength
      forceReturnLength
      pure
      idempotent
      stateful
    }
  }
  stateDependencies {
    key
    description
    optional
    demand {
      hash
      key
      app
      matches {
        ...BlokPortMatch
      }
      protocols
    }
  }
}

fragment BlokDiagnostic on Diagnostic {
  level
  code
  message
  path
}

fragment DetailBlok on Blok {
  id
  name
  description
  provided
  heldByAction
  app {
    id
    identifier
  }
  context
  module {
    id
    name
  }
  componentTree
  vocab
  catalogs
  locals {
    ...BlokLocal
  }
  resolvedLocals {
    ...ResolvedBlokLocal
  }
  demo {
    ...BlokDemo
  }
  queries {
    ...BlokQuery
  }
  subscriptions {
    ...BlokSubscription
  }
  diagnostics {
    ...BlokDiagnostic
  }
  dependencies {
    ...BlokDependency
  }
  args {
    ...ArgPort
  }
  head {
    ...BlokRevision
  }
}

fragment BlokLocal on BlokLocal {
  key
  label
  kind
  description
  identifier
  nullable
  default
  persist
  referenceUnit
  proposedUnits
  dimension
  children {
    ...ArgChildPort
  }
  choices {
    value
    label
    description
  }
}

# A local as the blok's tree resolves it: its kind always set (inferred when the blok left it
# out). What a renderer types the locals with; `locals` keeps them as written.
fragment ResolvedBlokLocal on ResolvedBlokLocal {
  key
  label
  kind
  description
  identifier
  nullable
  default
  persist
  referenceUnit
  proposedUnits
  dimension
  children {
    ...ArgChildPort
  }
  choices {
    value
    label
    description
  }
}

fragment BlokDemo on BlokDemo {
  deps
  args
  task
  queries
  subscriptions
}

fragment BlokQuery on BlokQuery {
  key
  service
  document
  variables {
    ...ActionArgument
  }
  poll
  more
}

fragment BlokSubscription on BlokSubscription {
  key
  service
  document
  variables {
    ...ActionArgument
  }
  keep
  history
}

fragment BlokRevision on BlokRevision {
  id
  number
  message
  createdAt
  author {
    sub
  }
  task {
    id
  }
  vocab
  catalogs
  locals {
    ...BlokLocal
  }
  resolvedLocals {
    ...ResolvedBlokLocal
  }
}

fragment DetailMaterializedBlok on MaterializedBlok {
  id
  name
  description
  declaredBy {
    id
    declaredName
  }
  blok {
    ...DetailBlok
  }
  agentMappings {
    key
    agent {
      id
      declaredName
      connected
    }
  }
  pinnedRevision {
    ...BlokRevision
  }
  unboundDependencies
}

fragment BlokEdit on BlokEdit {
  applied
  forked
  blok {
    ...DetailBlok
  }
  revision {
    ...BlokRevision
  }
  materializedBlok {
    ...DetailMaterializedBlok
  }
  diagnostics {
    ...BlokDiagnostic
  }
  resolvedLocals {
    ...ResolvedBlokLocal
  }
}

# An action's own blok for one context: how a client shows a run of it. It names devices
# only by the action's dependency keys, bound per run by Task.dependencyAgents.
fragment ActionBlok on ActionBlok {
  id
  context
  blok {
    ...DetailBlok
  }
}
