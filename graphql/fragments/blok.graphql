fragment Blok on Blok {
  id
  name
   
}

fragment MaterializedBlok on MaterializedBlok {
  id
}

fragment BlokPortMatch on PortMatch {
  at
  key
  kind
  identifier
  nullable
  dimension
  children {
    at
    key
    kind
    identifier
    nullable
    dimension
    children {
      at
      key
      kind
      identifier
      nullable
      dimension
      children {
        at
        key
        kind
        identifier
        nullable
        dimension
      }
    }
  }
}

fragment BlokDependency on BlokDependency {
  key
  description
  optional
  autoResolvable
  appFilter
  versionFilter
  minViableInstances
  maxViableInstances
  actionDependencies {
    key
    description
    optional
    demand {
      hash
      key
      app
      version
      name
      argMatches {
        ...BlokPortMatch
      }
      returnMatches {
        ...BlokPortMatch
      }
      protocols
      forceArgLength
      forceReturnLength
      pure
      idempotent
      stateful
    }
  }
  stateDependencies {
    key
    description
    optional
    demand {
      hash
      key
      app
      matches {
        ...BlokPortMatch
      }
      protocols
    }
  }
}

fragment BlokDiagnostic on Diagnostic {
  level
  code
  message
  path
}

fragment DetailBlok on Blok {
  id
  name
  description
  provided
  heldByAction
  app {
    id
    identifier
  }
  context
  catalog {
    id
    name
  }
  componentTree
  demoState
  diagnostics {
    ...BlokDiagnostic
  }
  dependencies {
    ...BlokDependency
  }
  args {
    ...ArgPort
  }
  persist {
    ...BlokPersist
  }
  head {
    ...BlokRevision
  }
}

fragment BlokPersist on BlokPersist {
  key
  description
}

fragment BlokRevision on BlokRevision {
  id
  number
  message
  createdAt
  author {
    sub
  }
  task {
    id
  }
  persist {
    ...BlokPersist
  }
}

fragment DetailMaterializedBlok on MaterializedBlok {
  id
  name
  description
  declaredBy {
    id
    declaredName
  }
  blok {
    ...DetailBlok
  }
  agentMappings {
    key
    agent {
      id
      declaredName
      connected
    }
  }
  pinnedRevision {
    ...BlokRevision
  }
  unboundDependencies
}

fragment BlokEdit on BlokEdit {
  applied
  forked
  blok {
    ...DetailBlok
  }
  revision {
    ...BlokRevision
  }
  materializedBlok {
    ...DetailMaterializedBlok
  }
  diagnostics {
    ...BlokDiagnostic
  }
}

# An action's own blok for one context: how a client shows a run of it. It names devices
# only by the action's dependency keys, bound per run by Task.dependencyAgents.
fragment ActionBlok on ActionBlok {
  id
  context
  blok {
    ...DetailBlok
  }
}
