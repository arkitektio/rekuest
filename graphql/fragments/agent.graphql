fragment Agent on Agent {
  id
  name
  hash
  supervisor
  connected
  active
  client {
    id
    clientId
  }
  user {
    sub
  }
  organization {
    identifier
  }
  memoryShelve {
    id
  }
}

fragment DesignAgent on Agent {
  id
  declaredName
  connected
  app {
    identifier
  }
  states {
    key
    interface
    definition {
      name
      ports {
        ...ReturnPort
      }
    }
  }
  implementations {
    interface
    action {
      id
      key
      name
      description
      args {
        ...ArgPort
      }
      returns {
        ...ReturnPort
      }
    }
  }
}
